{% extends 'base.html' %}
{% load static %}

{% block slider2%}
{% endblock slider2%}

{% block content %}
<style>
        /* Section Styling */
#portfolio {
  background-color:white;
  padding-top: 50px;
  padding-bottom: 50px;
}

.section-title h2 {
  font-size: 36px;
  color: #2C3E50;
}

.section-title h3 {
  font-size: 24px;
  color: #95A5A6;
  margin-bottom: 30px;
}

/* Card Styling */
.list-group {
  background-color: white;
  padding: 20px;
  border-radius: 8px;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

/* Breadcrumb Styling */
.breadcrumb-container {
  background-color: #f1f1f1;
  padding: 15px;
  border-radius: 5px;
}

.breadcrumb-item.active {
  font-weight: bold;
  color: #27AE60;
}

/* Form Styling */
.form-row .form-group {
  margin-bottom: 15px;
}

.form-control {
  border-radius: 5px;
  border: 1px solid #BDC3C7;
}

input[type="text"], input[type="email"], input[type="number"] {
  padding: 12px;
}

button.btn-success {
  background-color: #27AE60;
  border-color: #27AE60;
  font-size: 18px;
  padding: 12px 20px;
}

button.btn-success:hover {
  background-color: #2ECC71;
  border-color: #2ECC71;
}

/* Responsive Design */
@media (max-width: 767px) {
  .container {
    padding-left: 15px;
    padding-right: 15px;
  }

  .form-row .form-group {
    margin-bottom: 10px;
  }

  .btn-success {
    width: 100%;
  }
}
/* Ensure the dark background applies */
#portfolio {
    background-color: #121212 !important; /* Override conflicting styles */
    color: #ffffff !important; /* Text color */
    padding: 50px 0;
}

/* Ensure child text visibility */
#portfolio h2, #portfolio h3, #portfolio p {
    color: #ffffff !important;
}

 </style>
<!-- ======= Portfolio Section ======= -->


         <section id="portfolio" class="portfolio">
            <div class="container py-5" >
              <!-- {% for message in messages %}
                <div class="alert alert-{{message.tags}} alert-dismissible fade show" role="alert">
                  <strong>{{message}}</strong>
                  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
              {% endfor %} -->
        
              <div class="section-title text-center mb-5"  style="margin-top: 0px;">
                <h2 class="text-primary" >Checkout</h2>
                <h3 class="text-muted">Review Your Cart & Enter Your Details</h3>
              </div>
        
              <!-- Step 1: Review Cart -->
              <div class="row">
                <div class="col-lg-6">
                  <h4 class="mb-4">Step 1: Review Your Cart</h4>
                  <ul class="list-group" id="items">
                    <!-- Dynamic Cart Items will appear here -->
                  </ul>
        
                  <div class="breadcrumb-container mt-4">
                    <nav aria-label="breadcrumb">
                      <ol class="breadcrumb">
                        <li class="breadcrumb-item active" aria-current="page">Your Cart Total: <strong>Rs. <span id="totalprice"></span></strong> <span id="amount"></span></li>
                      </ol>
                    </nav>
                  </div>
                </div>
        
                <!-- Step 2: Enter Address & Other Details -->
                <div class="col-lg-6">
                  <h4 class="mb-4">Step 2: Enter Your Details</h4>
                  <form method="post" action="/checkout/">
                    {% csrf_token %}
                    <input type="hidden" name="itemsJson" id="itemsJson">
                    <input type="hidden" id="amt" name="amt">
        
                    <div class="form-row">
                      <div class="form-group col-md-6">
                        <label for="inputname">Name</label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="Full Name" required>
                      </div>
                      <div class="form-group col-md-6">
                        <label for="inputEmail4">Email</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="Email Address" value="{{user.email}}" required>
                      </div>
                    </div>
        
                    <div class="form-row">
                      <div class="form-group col-md-6">
                        <label for="inputAddress">Address Line 1</label>
                        <input type="text" class="form-control" id="address1" name="address1" placeholder="1234 Main St" required>
                      </div>
                      <div class="form-group col-md-6">
                        <label for="inputAddress2">Address Line 2</label>
                        <input type="text" class="form-control" id="address2" name="address2" placeholder="Apartment, suite, etc." required>
                      </div>
                    </div>
        
                    <div class="form-row">
                      <div class="form-group col-md-6">
                        <label for="inputCity">City</label>
                        <input type="text" class="form-control" id="city" name="city" required>
                      </div>
                      <div class="form-group col-md-6">
                        <label for="inputState">State</label>
                        <input type="text" class="form-control" id="state" name="state" placeholder="Enter State" required>
                      </div>
                    </div>
        
                    <div class="form-row">
                      <div class="form-group col-md-6">
                        <label for="inputZip">Pin Code</label>
                        <input type="number" class="form-control" id="zip_code" name="zip_code" required>
                      </div>
                      <div class="form-group col-md-6">
                        <label for="inputPhone">Phone Number</label>
                        <input type="number" class="form-control" id="phone" name="phone" required>
                      </div>
                    </div>
        
                    <div class="form-group text-center mt-4">
                      <button type="submit" class="btn btn-success btn-lg col-md-6">Place Order</button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
        </section>
        
<script src="https://code.jquery.com/jquery-3.3.1.js"integrity="sha256-2Kok7MbOyxpgUVvAk/HJ2jigOSYS2auK4Pfzbm7uH60="crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.6/umd/popper.min.js" integrity="sha384-wHAiFfRlMFy6i5SRaxvfOCifBUQy1xHdJ/yoi7FRNXMRBu5WHdZYu1hA6ZOblgut" crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/js/bootstrap.min.js" integrity="sha384-B0UglyR+jN6CkvvICOB2joaf5I4l3gm9GU6Hc1og6Ls7i6U/mkkaduKaBhlAXv9k" crossorigin="anonymous"></script>
  
  <script>
// Initialize cart
let cart = localStorage.getItem('cart') ? JSON.parse(localStorage.getItem('cart')) : {};

// Populate cart items
let totalPrice = 0;
if (Object.keys(cart).length === 0) {
    $('#items').html('<p>Your cart is empty. Please add items before checking out!</p>');
} else {
    for (let item in cart) {
        const [qty, name, price] = cart[item];
        totalPrice += qty * price;

        $('#items').append(`
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                    <b>${name}</b>
                    <div>Price: ${price}</div>
                </div>
                <span class="badge badge-primary">${qty}</span>
                <input type="number" class="form-control form-control-sm ml-2 edit-quantity" 
                       data-item="${item}" value="${qty}" style="width: 60px;">
                <button class="btn btn-danger btn-sm ml-2 delete-item" data-item="${item}">Delete</button>
            </li>
        `);
    }
}

// Update total price
$('#totalprice').text(totalPrice);
$('#amt').val(totalPrice);

// Delete item
$(document).on('click', '.delete-item', function () {
    const item = $(this).data('item');
    delete cart[item];
    localStorage.setItem('cart', JSON.stringify(cart));
    location.reload();
});

// Edit quantity
$(document).on('input', '.edit-quantity', function () {
    const item = $(this).data('item');
    const qty = parseInt($(this).val());
    if (qty > 0) {
        cart[item][0] = qty;
        localStorage.setItem('cart', JSON.stringify(cart));
        location.reload();
    } else {
        alert('Quantity must be greater than 0.');
    }
});

// Handle empty cart
$('#itemsJson').val(JSON.stringify(cart));
  
  </script>
  
  
{% endblock %}

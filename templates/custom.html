<!-- Offers Section -->
<section class="offer_section layout_padding-bottom" style="background: linear-gradient(to right, #a34526, #f4d49d); color: white;" >
    <div class="offer_container">
      <div class="container">
        <div class="heading_container heading_center">
          <h2>Our Offers</h2>
        </div>
        <div class="row">
          {% for offer in offers %}
          <div class="col-md-6">
            <div class="box">
              <div class="img-box">
                <img src="{{ offer.img.url }}" alt="image not found">
              </div>
              <div class="detail-box">
                <h5>{{ offer.Offer_name }}</h5>
                <h6>
                  <span>{{ offer.Offer }}</span> Off
                </h6>
                <a href="#">
                  Order Now
                </a>
              </div>
            </div>
          </div>
          {% endfor %}
        </div>
      </div>
    </div>
  </section>












  <header class="header_section" style="background: linear-gradient(to right, #803434, #B8860B); color: white; padding: 10px;">
    <div class="container">
      <nav class="navbar navbar-expand-lg custom_nav-container">
        <!-- Brand -->
        <a class="navbar-brand me-4" href="/">
          <span>ZestyZone</span>
        </a>
  
        <!-- Toggler for mobile view -->
        <button 
          class="navbar-toggler" 
          type="button" 
          data-toggle="collapse" 
          data-target="#navbarSupportedContent" 
          aria-controls="navbarSupportedContent" 
          aria-expanded="false" 
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
  
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <!-- Empty Center Links -->
          <ul class="navbar-nav mx-auto"></ul>
  
          <!-- User Options -->
          <div class="user_option d-flex align-items-center">
            <!-- Home Icon -->
            <a href="/" class="nav-link me-3">
              <img 
                src="{% static 'images/icons8-home-24.png' %}" 
                alt="Home" 
                style="height: 25px; width: 25px; margin-left:20px ;" 
              />
            </a>
  
            <!-- Menu Icon -->
            <a href="/menu" class="nav-link me-3">
              <i class="fa-solid fa-utensils" style="color: white; font-size: 20px;"></i>
            </a>
  
            <!-- Cart Button -->
            <button 
              class="btn btn-link text-white me-3" 
              type="button" 
              id="popcart" 
              data-container="body" 
              data-toggle="popover" 
              data-placement="bottom" 
              data-html="true"
            >
              <i class="fa-solid fa-cart-shopping"></i> (<span id="cart">0</span>)
            </button>
  
            <!-- Search Bar -->
            <form method="GET" action="{% url 'menu' %}" class="form-inline me-3">
              <input 
                name="q" 
                type="text" 
                class="form-control me-2" 
                placeholder="Search for products..." 
                value="{{ query|default:'' }}" 
                style="width: 200px; padding: 10px; border-radius: 20px;"
              />
              <button type="submit" class="btn btn-primary" style="border-radius: 20px;">Search</button>
            </form>
  
            <!-- Dropdown Menu -->
            <div class="dropdown me-3">
              <a 
                href="javascript:void(0)" 
                class="user_link" 
                id="userDropdown" 
                onclick="toggleDropdown()"
              >
                <i class="fa fa-angle-down" style="font-size: xx-large;"></i>
              </a>
              <div id="dropdownMenu" class="dropdown-menu">
                {% if not request.user.is_authenticated %}
                  <a href="/auth/signup" class="dropdown-item" style="font-weight: bold;">SIGNUP</a>
                  <a href="/auth/login" class="dropdown-item" style="font-weight: bold;">LOGIN</a>
                {% else %}
                  <a href="/profile" class="dropdown-item" style="font-weight: bold;">PROFILE</a>
                  <a href="/checkout" class="dropdown-item" style="font-weight: bold;">CHECKOUT</a>
                  <a href="/auth/logout" class="dropdown-item" style="font-weight: bold;">LOGOUT</a>
                {% endif %}
                <a href="/about" class="dropdown-item" style="font-weight: bold;">ABOUT</a>
                <a href="/contact" class="dropdown-item" style="font-weight: bold;">CONTACT</a>
              </div>
            </div>
  
            <!-- Theme Switch -->
            <label class="theme-switch">
              <input type="checkbox" id="themeSwitch">
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </nav>
    </div>
  </header>
